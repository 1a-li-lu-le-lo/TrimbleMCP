# OpenAI Codex CLI / IDE: add to ~/.codex/config.toml, or to .codex/config.toml in a trusted project.
# Source (checked 2026-09-23): https://learn.chatgpt.com/docs/extend/mcp?surface=cli
#                              https://learn.chatgpt.com/docs/config-file/config-reference

[mcp_servers.trimble]
command = "trimble-mcp"
args = ["-transport", "stdio"]
startup_timeout_sec = 10
tool_timeout_sec = 60
# Read-only tools only; nothing here can mutate Trimble data.
enabled_tools = [
  "trimble_get_capabilities",
  "trimble_list_projects",
  "trimble_get_project",
  "trimble_list_folder_items",
  "trimble_get_file_metadata",
]

[mcp_servers.trimble.env]
TRIMBLE_MCP_ENABLE_MOCK = "true"
TRIMBLE_CONNECT_ENABLED = "false"
# For sandbox Trimble Connect access, set instead:
# TRIMBLE_CONNECT_ENABLED = "true"
# TRIMBLE_CONNECT_ENV = "stage"
# TRIMBLE_CONNECT_REGION = "us"
# TRIMBLE_TOKEN_STORE = "/secure/path/tc-token"
# TRIMBLE_TOKEN_KEY_FILE = "/secure/path/tc-token.key"

# Remote alternative (Streamable HTTP):
# [mcp_servers.trimble_remote]
# url = "https://mcp.example.com/mcp"
# bearer_token_env_var = "TRIMBLE_MCP_TOKEN"
